name: Build NES Mini ARMv7 SGBPACK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "tools/**"
      - ".github/workflows/build-nesmini.yml"

permissions:
  contents: read

jobs:
  nesmini-armv7:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout SGBPACK project
        uses: actions/checkout@v4
        with:
          path: sgbpack-project

      - name: Checkout pinned SuperSnes9x
        uses: actions/checkout@v4
        with:
          repository: shanytc/snes9x
          ref: 183e03e5efed3b6d450385c98e2ccffb194153c3
          submodules: false
          path: supersnes9x

      - name: Install host build tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y wget xz-utils make bc file dpkg-dev

      - name: Checkout Linaro GCC 7 ARMhf toolchain
        uses: actions/checkout@v4
        with:
          repository: MayuriLabs/linaro_arm-linux-gnueabihf-7.5
          ref: master
          path: toolchain
          fetch-depth: 1

      - name: Prepare GLIBC 2.23 sysroot
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/xenial-debs" "$GITHUB_WORKSPACE/xenial-sysroot"

          docker run --rm \
            -v "$GITHUB_WORKSPACE/xenial-debs:/out" \
            ubuntu:16.04 bash -ec '
              printf "%s\n" \
                "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports xenial main universe" \
                "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports xenial-updates main universe" \
                "deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports xenial-security main universe" \
                > /etc/apt/sources.list
              apt-get update
              cd /out
              apt-get download libc6:armhf libc6-dev:armhf linux-libc-dev:armhf
            '

          for pkg in "$GITHUB_WORKSPACE"/xenial-debs/*.deb; do
            dpkg-deb -x "$pkg" "$GITHUB_WORKSPACE/xenial-sysroot"
          done

          test -e "$GITHUB_WORKSPACE/xenial-sysroot/lib/arm-linux-gnueabihf/libc.so.6"
          test -e "$GITHUB_WORKSPACE/xenial-sysroot/usr/include/stdio.h"
          strings "$GITHUB_WORKSPACE/xenial-sysroot/lib/arm-linux-gnueabihf/libc.so.6" \
            | grep -q "GLIBC_2.23"

          mkdir -p "$GITHUB_WORKSPACE/wrappers"
          cat > "$GITHUB_WORKSPACE/wrappers/arm-linux-gnueabihf-gcc" <<'EOF'
          #!/bin/sh
          exec "$GITHUB_WORKSPACE/toolchain/bin/arm-linux-gnueabihf-gcc" --sysroot="$GITHUB_WORKSPACE/xenial-sysroot" "$@"
          EOF
          cat > "$GITHUB_WORKSPACE/wrappers/arm-linux-gnueabihf-g++" <<'EOF'
          #!/bin/sh
          exec "$GITHUB_WORKSPACE/toolchain/bin/arm-linux-gnueabihf-g++" --sysroot="$GITHUB_WORKSPACE/xenial-sysroot" -std=gnu++17 "$@"
          EOF
          chmod +x "$GITHUB_WORKSPACE"/wrappers/*

          "$GITHUB_WORKSPACE/wrappers/arm-linux-gnueabihf-gcc" -dumpversion
          "$GITHUB_WORKSPACE/wrappers/arm-linux-gnueabihf-g++" -dumpversion

      - name: Apply SGBPACK integration
        shell: pwsh
        run: |
          python sgbpack-project/tools/apply_sgbpack.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location supersnes9x
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "memmap.cpp" -Pattern "Loaded SGBPACK1 single-file Super Game Boy image." -Quiet)) {
            Write-Error "SGBPACK integration marker missing from memmap.cpp"
            exit 1
          }

      - name: Build NES Mini core against GLIBC 2.23
        working-directory: supersnes9x/libretro
        run: |
          set -e
          make clean || true
          make -j2 \
            platform=classic_armv7_a7 \
            CC="$GITHUB_WORKSPACE/wrappers/arm-linux-gnueabihf-gcc" \
            CXX="$GITHUB_WORKSPACE/wrappers/arm-linux-gnueabihf-g++" \
            AR="$GITHUB_WORKSPACE/toolchain/bin/arm-linux-gnueabihf-ar" \
            STRIP="$GITHUB_WORKSPACE/toolchain/bin/arm-linux-gnueabihf-strip" \
            HAVE_UNZIP=0 \
            LDFLAGS="-static-libgcc -static-libstdc++" \
            LIBS="$GITHUB_WORKSPACE/xenial-sysroot/lib/arm-linux-gnueabihf/libm.so.6"

      - name: Verify NES Mini ABI and GLIBC floor
        working-directory: supersnes9x/libretro
        run: |
          set -e
          READELF="$GITHUB_WORKSPACE/toolchain/bin/arm-linux-gnueabihf-readelf"
          CORE=supersnes9x_libretro.so
          test -f "$CORE"

          {
            echo "=== file ==="
            file "$CORE"
            echo "=== ELF header ==="
            "$READELF" -h "$CORE"
            echo "=== ARM attributes ==="
            "$READELF" -A "$CORE"
            echo "=== dynamic dependencies ==="
            "$READELF" -d "$CORE"
            echo "=== symbol version requirements ==="
            "$READELF" -V "$CORE"
          } | tee verify-nesmini.txt

          file "$CORE" | grep -q "ELF 32-bit"
          "$READELF" -h "$CORE" | grep -q "Machine:.*ARM"
          "$READELF" -h "$CORE" | grep -q "hard-float ABI"
          "$READELF" -A "$CORE" | grep -q "Tag_ABI_VFP_args: VFP registers"

          if "$READELF" -V "$CORE" | grep -Eq 'GLIBC_2\.(2[4-9]|[3-9][0-9])'; then
            echo "ERROR: core requires GLIBC newer than 2.23"
            "$READELF" -V "$CORE" | grep -E 'GLIBC_2\.'
            exit 1
          fi

          if "$READELF" -d "$CORE" | grep -Eq 'Shared library: \[(libstdc\+\+|libgcc_s)'; then
            echo "ERROR: core still depends on libstdc++ or libgcc_s"
            "$READELF" -d "$CORE" | grep 'Shared library'
            exit 1
          fi

      - name: Strip and package
        working-directory: supersnes9x/libretro
        run: |
          set -e
          "$GITHUB_WORKSPACE/toolchain/bin/arm-linux-gnueabihf-strip" --strip-unneeded supersnes9x_libretro.so
          mkdir -p ../../dist-nesmini
          cp supersnes9x_libretro.so ../../dist-nesmini/supersnes9x_sgbpack_libretro.so
          cp verify-nesmini.txt ../../dist-nesmini/
          sha256sum ../../dist-nesmini/supersnes9x_sgbpack_libretro.so > ../../dist-nesmini/SHA256.txt

      - name: Build Hakchi HMOD
        run: |
          set -e
          HMOD_DIR="$GITHUB_WORKSPACE/dist-hmod/sgbpack.hmod"
          mkdir -p "$HMOD_DIR/bin" "$HMOD_DIR/etc/libretro/core" "$HMOD_DIR/etc/libretro/info"

          cp "$GITHUB_WORKSPACE/dist-nesmini/supersnes9x_sgbpack_libretro.so" \
            "$HMOD_DIR/etc/libretro/core/km_sgbpack_libretro.so"

          cat > "$HMOD_DIR/bin/sgbpack" <<'EOF'
          #!/bin/sh
          exec retroarch-clover km_sgbpack "$1" "${@:2}"
          EOF
          chmod +x "$HMOD_DIR/bin/sgbpack"

          cat > "$HMOD_DIR/etc/libretro/info/km_sgbpack_libretro.info" <<'EOF'
          display_name = "Nintendo - Super Game Boy (SGBPACK)"
          authors = "Snes9x Team|SuperSnes9x|rulesnine"
          supported_extensions = "sfc"
          corename = "SuperSnes9x SGBPACK"
          manufacturer = "Nintendo"
          categories = "Emulator"
          systemname = "Super Game Boy"
          systemid = "super_game_boy"
          database = "Nintendo - Game Boy"
          license = "Non-commercial"
          permissions = ""
          display_version = "SGBPACK v1"
          supports_no_game = "false"
          firmware_count = 0
          notes = "Custom SGBPACK core for NES/SNES Classic. Requires a self-contained SGBPACK .sfc image."
          EOF

          cat > "$HMOD_DIR/install" <<'EOF'
          transfer_default
          chmod +x $rootfs/bin/*
          chmod +x $rootfs/usr/bin/*
          return 1
          EOF

          cat > "$HMOD_DIR/readme.md" <<'EOF'
          -----------------------
          Name: SuperSnes9x SGBPACK
          Creator: Snes9x Team|SuperSnes9x|rulesnine
          Category: Custom Core
          Emulated System: Nintendo Super Game Boy
          Command Line: /bin/sgbpack
          -----------------------

          Requires RetroArch for Hakchi CE/KMFD.
          Designed for NES Classic / NES Mini ARMv7 hard-float.
          Built against glibc 2.23.
          Use with a self-contained SGBPACK .sfc file.
          EOF

          cd "$HMOD_DIR"
          tar -czf "$GITHUB_WORKSPACE/dist-hmod/SuperSnes9x_SGBPACK_NESMini_ARMv7.hmod" .
          cd "$GITHUB_WORKSPACE"
          sha256sum dist-hmod/SuperSnes9x_SGBPACK_NESMini_ARMv7.hmod > dist-hmod/HMOD_SHA256.txt
          tar -tzf dist-hmod/SuperSnes9x_SGBPACK_NESMini_ARMv7.hmod

      - name: Upload NES Mini ARMv7 build
        uses: actions/upload-artifact@v4
        with:
          name: SuperSnes9x-SGBPACK-NESMini-ARMv7-GLIBC223
          path: dist-nesmini
          retention-days: 30

      - name: Upload Hakchi HMOD
        uses: actions/upload-artifact@v4
        with:
          name: SuperSnes9x-SGBPACK-Hakchi-HMOD
          path: |
            dist-hmod/SuperSnes9x_SGBPACK_NESMini_ARMv7.hmod
            dist-hmod/HMOD_SHA256.txt
          retention-days: 30
