name: Build NES Mini Native N1.7 EGL HMOD

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/build-nesmini-native.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ARMv7 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf

      - name: Build ARMv7 EGL frontend via dlopen
        run: |
          mkdir -p dist
          COMMON="-O3 -pipe -march=armv7-a -mtune=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard -D_FILE_OFFSET_BITS=64"
          arm-linux-gnueabihf-gcc $COMMON native/sgbpack_native_n1.c -o dist/sgbpack-native -ldl
          arm-linux-gnueabihf-strip dist/sgbpack-native
          file dist/sgbpack-native
          arm-linux-gnueabihf-readelf -d dist/sgbpack-native | tee dist/DYNAMIC.txt
          arm-linux-gnueabihf-readelf --version-info dist/sgbpack-native | tee dist/VERSIONS.txt
          sha256sum dist/sgbpack-native | tee dist/SHA256SUMS.txt

      - name: Build HMOD
        run: |
          rm -rf hmod-stage
          mkdir -p hmod-stage/bin
          cp dist/sgbpack-native hmod-stage/bin/sgbpack-native
          chmod 755 hmod-stage/bin/sgbpack-native

          cat > hmod-stage/install <<'EOF'
          #!/bin/sh
          copy "./bin/sgbpack-native" "$rootfs/bin/sgbpack-native"
          chmod +x "$rootfs/bin/sgbpack-native"
          EOF

          cat > hmod-stage/uninstall <<'EOF'
          #!/bin/sh
          rm -f "$rootfs/bin/sgbpack-native"
          EOF

          chmod 755 hmod-stage/install hmod-stage/uninstall
          tar -C hmod-stage -czf IkCore-Native-N1_7-EGL.hmod .
          sha256sum IkCore-Native-N1_7-EGL.hmod > IkCore-Native-N1_7-EGL.hmod.sha256

      - name: Package diagnostics
        run: |
          cp native/README.md dist/README-NATIVE.txt
          tar -C dist -czf IkCore-NESMini-Native-N1_7-EGL.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: IkCore-Native-N1_7-EGL-HMOD
          path: |
            IkCore-Native-N1_7-EGL.hmod
            IkCore-Native-N1_7-EGL.hmod.sha256
            IkCore-NESMini-Native-N1_7-EGL.tar.gz
          if-no-files-found: error
