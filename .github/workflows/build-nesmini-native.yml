name: Build NES Mini Native N1.7 EGL HMOD

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/build-nesmini-native.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Linaro ARMv7 toolchain + glibc 2.23 sysroot
        run: |
          set -eux
          mkdir -p toolchain dist
          cd toolchain

          curl -fL --retry 3 -o gcc.tar.xz             https://releases.linaro.org/components/toolchain/binaries/6.3-2017.05/arm-linux-gnueabihf/gcc-linaro-6.3.1-2017.05-x86_64_arm-linux-gnueabihf.tar.xz

          curl -fL --retry 3 -o sysroot.tar.xz             https://releases.linaro.org/components/toolchain/binaries/6.3-2017.05/arm-linux-gnueabihf/sysroot-glibc-linaro-2.23-2017.05-arm-linux-gnueabihf.tar.xz

          tar -xf gcc.tar.xz
          tar -xf sysroot.tar.xz

      - name: Build ARMv7 for NES Mini glibc 2.23
        run: |
          set -eux

          TC="$PWD/toolchain/gcc-linaro-6.3.1-2017.05-x86_64_arm-linux-gnueabihf"
          SYSROOT="$PWD/toolchain/sysroot-glibc-linaro-2.23-2017.05-arm-linux-gnueabihf"
          CC="$TC/bin/arm-linux-gnueabihf-gcc"
          STRIP="$TC/bin/arm-linux-gnueabihf-strip"
          READELF="$TC/bin/arm-linux-gnueabihf-readelf"

          COMMON="-O3 -pipe -march=armv7-a -mtune=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard -D_FILE_OFFSET_BITS=64 --sysroot=$SYSROOT"

          "$CC" $COMMON native/sgbpack_native_n1.c -o dist/sgbpack-native -ldl
          "$STRIP" dist/sgbpack-native

          file dist/sgbpack-native
          "$READELF" -l dist/sgbpack-native > dist/PROGRAM_HEADERS.txt
          "$READELF" -d dist/sgbpack-native > dist/DYNAMIC.txt
          "$READELF" --version-info dist/sgbpack-native > dist/VERSIONS.txt
          cat dist/VERSIONS.txt

          python3 - <<'PY'
          import re, pathlib, sys
          text = pathlib.Path("dist/VERSIONS.txt").read_text(errors="ignore")
          versions = sorted({(int(a), int(b)) for a,b in re.findall(r"GLIBC_(\d+)\.(\d+)", text)})
          print("GLIBC requeridas:", versions)
          bad = [v for v in versions if v > (2,23)]
          if bad:
              print("ERROR: binario incompatible con NES Mini; requiere:", bad)
              sys.exit(1)
          print("ABI NES Mini: OK, no requiere GLIBC > 2.23")
          PY

          sha256sum dist/sgbpack-native | tee dist/SHA256SUMS.txt

      - name: Build HMOD
        run: |
          set -eux
          rm -rf hmod-stage
          mkdir -p hmod-stage/bin
          cp dist/sgbpack-native hmod-stage/bin/sgbpack-native
          chmod 755 hmod-stage/bin/sgbpack-native

          cat > hmod-stage/install <<'EOF'
          #!/bin/sh
          copy "./bin/sgbpack-native" "$rootfs/bin/sgbpack-native"
          chmod +x "$rootfs/bin/sgbpack-native"
          EOF

          cat > hmod-stage/uninstall <<'EOF'
          #!/bin/sh
          rm -f "$rootfs/bin/sgbpack-native"
          EOF

          chmod 755 hmod-stage/install hmod-stage/uninstall
          tar -C hmod-stage -czf IkCore-Native-N1_7-EGL-GLIBC223.hmod .
          sha256sum IkCore-Native-N1_7-EGL-GLIBC223.hmod > IkCore-Native-N1_7-EGL-GLIBC223.hmod.sha256

      - name: Package diagnostics
        run: |
          cp native/README.md dist/README-NATIVE.txt
          tar -C dist -czf IkCore-NESMini-Native-N1_7-EGL-GLIBC223.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: IkCore-Native-N1_7-EGL-GLIBC223-HMOD
          path: |
            IkCore-Native-N1_7-EGL-GLIBC223.hmod
            IkCore-Native-N1_7-EGL-GLIBC223.hmod.sha256
            IkCore-NESMini-Native-N1_7-EGL-GLIBC223.tar.gz
          if-no-files-found: error
